<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        input {
            padding: 12px;
            width: 60%;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            margin-left: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        li {
            list-style: none;
            background: #1e293b;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>

    <input type="text" id="taskInput" placeholder="Enter your task">

    <button id="addButton">Add</button>

    <ul id="taskList"></ul>

</div>

<script>
    const input = document.getElementById("taskInput");
    const button = document.getElementById("addButton");
    const list = document.getElementById("taskList");

    button.addEventListener("click", function() {

        const task = input.value.trim();

        if (task === "") {
            alert("Please enter your task");
            return;
        }

        const li = document.createElement("li");

        li.textContent = task;

        list.appendChild(li);

        input.value = "";
    });
</script>

</body>
</html>
