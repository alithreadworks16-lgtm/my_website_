<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        input {
            padding: 12px;
            width: 55%;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 16px;
            margin-left: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            background: #1e293b;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .task {
            flex: 1;
            text-align: left;
        }

        .done {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .done-btn {
            background: green;
            color: white;
        }

        .delete-btn {
            background: red;
            color: white;
        }

        #clearButton {
            background: orange;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>
    <p id="taskCount">Total Tasks: 0</p>
    <p id="completedCount">Completed Tasks: 0</p>
    <p id="progress">Progress: 0%</p>

    <input
        type="text"
        id="taskInput"
        placeholder="Enter your task"
    >

    <button id="addButton">Add</button>

    <button id="clearButton">Clear All</button>

    <ul id="taskList"></ul>

</div>

<script>

    const input = document.getElementById("taskInput");
    const button = document.getElementById("addButton");
    const clearButton = document.getElementById("clearButton");
    const list = document.getElementById("taskList");
    const taskCount = document.getElementById("taskCount");
    const completedCount = document.getElementById("completedCount");

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];


    function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
    }


    function showTasks() {

        list.innerHTML = "";
        taskCount.textContent = "Total Tasks: " + tasks.length;
        const completed = tasks.filter(function(task) {
    return task.done;
}).length;

completedCount.textContent = "Completed Tasks: " + completed;
        let progress = 0;

if (tasks.length > 0) {
    progress = (completed / tasks.length) * 100;
}

document.getElementById("progress").textContent = "Progress: " + progress + "%";

        tasks.forEach(function(task, index) {

            const li = document.createElement("li");

            const taskText = document.createElement("span");
            taskText.textContent = task.text;
            taskText.className = "task";

            if (task.done) {
                taskText.classList.add("done");
            }


            const doneButton = document.createElement("button");

            doneButton.textContent = task.done ? "Undo" : "Done";

            doneButton.className = "done-btn";


            doneButton.addEventListener("click", function() {

                tasks[index].done = !tasks[index].done;

                saveTasks();

                showTasks();

            });


            const deleteButton = document.createElement("button");
            const editButton = document.createElement("button");

editButton.textContent
            editButton.addEventListener("click", function() {

    const newTask = prompt("Edit your task:", task.text);

    if (newTask !== null && newTask.trim() !== "") {
        tasks[index].text = newTask.trim();

        saveTasks();
        showTasks();
    }

});

            deleteButton.textContent = "Delete";

            deleteButton.className = "delete-btn";


            deleteButton.addEventListener("click", function() {

                tasks.splice(index, 1);

                saveTasks();

                showTasks();

            });


            li.appendChild(taskText);

            li.appendChild(doneButton);

            li.appendChild(deleteButton);

            list.appendChild(li);

        });

    }


    button.addEventListener("click", function() {

        const task = input.value.trim();

        if (task === "") {

            alert("Please enter your task");

            return;

        }


        tasks.push({

            text: task,

            done: false

        });


        saveTasks();

        showTasks();

        input.value = "";

    });


    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            button.click();

        }

    });


    clearButton.addEventListener("click", function() {

        if (tasks.length === 0) {

            alert("There are no tasks to clear.");

            return;

        }


        const confirmClear = confirm("Are you sure you want to delete all tasks?");

        if (confirmClear) {

            tasks = [];

            saveTasks();

            showTasks();

        }

    });


    showTasks();

</script>

</body>
</html>
