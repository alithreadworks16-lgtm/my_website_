<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin: 8px;
        }

        input {
            width: 65%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        button {
            padding: 11px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 4px;
            font-size: 14px;
        }

        #addButton {
            background: #22c55e;
            color: white;
        }

        #clearButton {
            background: #ef4444;
            color: white;
            margin-top: 15px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        li {
            background: #334155;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            flex-wrap: wrap;
        }

        .task-text {
            flex: 1;
            text-align: left;
            word-break: break-word;
        }

        .done {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .done-btn {
            background: #22c55e;
            color: white;
        }

        .edit-btn {
            background: #3b82f6;
            color: white;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }

        #progress {
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <p id="taskCount">Total Tasks: 0</p>

        <p id="completedCount">Completed Tasks: 0</p>

        <p id="progress">Progress: 0%</p>

        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task"
        >

        <button id="addButton">Add</button>

        <ul id="taskList"></ul>

        <button id="clearButton">Clear All</button>

    </div>


    <script>

        const input = document.getElementById("taskInput");

        const button = document.getElementById("addButton");

        const list = document.getElementById("taskList");

        const taskCount = document.getElementById("taskCount");

        const completedCount =
            document.getElementById("completedCount");

        const clearButton =
            document.getElementById("clearButton");


        let tasks =
            JSON.parse(localStorage.getItem("tasks")) || [];


        function saveTasks() {

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        }


        function showTasks() {

            list.innerHTML = "";


            // Total tasks

            taskCount.textContent =
                "Total Tasks: " + tasks.length;


            // Completed tasks

            const completed =
                tasks.filter(function(task) {

                    return task.done;

                }).length;


            completedCount.textContent =
                "Completed Tasks: " + completed;


            // Progress

            let progress = 0;


            if (tasks.length > 0) {

                progress =
                    (completed / tasks.length) * 100;

            }


            document.getElementById("progress").textContent =
                "Progress: " + progress + "%";


            // Show every task

            tasks.forEach(function(task, index) {

                const li =
                    document.createElement("li");


                const taskText =
                    document.createElement("span");


                taskText.textContent =
                    task.text;


                taskText.className =
                    "task-text";


                if (task.done) {

                    taskText.classList.add("done");

                }


                // Done / Undo button

                const doneButton =
                    document.createElement("button");


                doneButton.textContent =
                    task.done ? "Undo" : "Done";


                doneButton.className =
                    "done-btn";


                doneButton.addEventListener(
                    "click",
                    function() {

                        tasks[index].done =
                            !tasks[index].done;

                        saveTasks();

                        showTasks();

                    }
                );


                // Edit button

                const editButton =
                    document.createElement("button");


                editButton.textContent =
                    "Edit";


                editButton.className =
                    "edit-btn";


                editButton.addEventListener(
                    "click",
                    function() {

                        const newTask =
                            prompt(
                                "Edit your task:",
                                task.text
                            );


                        if (
                            newTask !== null &&
                            newTask.trim() !== ""
                        ) {

                            tasks[index].text =
                                newTask.trim();

                            saveTasks();

                            showTasks();

                        }

                    }
                );


                // Delete button

                const deleteButton =
                    document.createElement("button");


                deleteButton.textContent =
                    "Delete";


                deleteButton.className =
                    "delete-btn";


                deleteButton.addEventListener(
                    "click",
                    function() {

                        tasks.splice(index, 1);

                        saveTasks();

                        showTasks();

                    }
                );


                li.appendChild(taskText);

                li.appendChild(doneButton);

                li.appendChild(editButton);

                li.appendChild(deleteButton);

                list.appendChild(li);

            });

        }


        // Add task

        button.addEventListener(
            "click",
            function() {

                const task =
                    input.value.trim();


                if (task === "") {

                    alert("Please enter your task");

                    return;

                }


                tasks.push({

                    text: task,

                    done: false

                });


                input.value = "";

                saveTasks();

                showTasks();

            }
        );


        // Enter key

        input.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    button.click();

                }

            }
        );


        // Clear All

        clearButton.addEventListener(
            "click",
            function() {

                if (tasks.length === 0) {

                    return;

                }


                const confirmClear =
                    confirm(
                        "Are you sure you want to clear all tasks?"
                    );


                if (confirmClear) {

                    tasks = [];

                    saveTasks();

                    showTasks();

                }

            }
        );


        // Load tasks when page opens

        showTasks();

    </script>

</body>

</html>
